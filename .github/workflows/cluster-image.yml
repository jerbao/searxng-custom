# Publishes the image built from this fork (stack/Dockerfile) for the k3s
# cluster, which pulls it from ghcr.io through the Harbor proxy cache.
# Upstream workflows only run on master, so they never fire here.
name: Cluster image

on:
  push:
    branches:
      - custom/master
    paths:
      - "searx/**"
      - "container/**"
      - "stack/Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/cluster-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cluster-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/searxng-custom
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: stack/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            VCS_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
