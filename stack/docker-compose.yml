# SearXNG stack for Firecrawl integration
# Builds the SearXNG image from this fork's source (with wikidata + cache
# patches) using the project's own 2-stage Dockerfile pair
# (container/builder.dockerfile + container/dist.dockerfile). Output tag
# defaults to localhost/searxng-custom/searxng:dev so it doesn't collide
# with the upstream docker.io/searxng/searxng image.
#
# Connects to the "backend" docker network that Firecrawl already manages,
# so Firecrawl-api can reach SearXNG at http://searxng-core:8080 without
# exposing it on the host.
#
# Usage on VM 1 (after Firecrawl stack is already running):
#   cd ~/.services/searxng             # copy this stack/ dir here
#   cp .env.example .env                # then edit SEARXNG_SECRET
#   docker compose build searxng-core    # builds ~3-5 min from source
#   docker compose up -d
#   # test:
#   docker exec firecrawl-api-1 curl -sS 'http://searxng-core:8080/search?q=firecrawl&format=json' | head -c 500
name: searxng

x-sxng-build-common: &sxng-build-common
  context: ..        # repo root (one above stack/, where this file lives)
  dockerfile: stack/Dockerfile

services:
  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data/
    networks:
      - backend

  searxng-core:
    container_name: searxng-core
    build:
      <<: *sxng-build-common
      tags:
        - localhost/searxng-custom/searxng:dev
    image: localhost/searxng-custom/searxng:dev
    restart: unless-stopped
    # NOTE: no `ports:` here. SearXNG is only reachable from containers on
    # the shared "backend" network. Firecrawl-api resolves it as
    # http://searxng-core:8080. Expose externally only if you put a TLS
    # reverse proxy in front.
    env_file: ./.env
    volumes:
      - ./core-config:/etc/searxng
      - core-data:/var/cache/searxng/
    depends_on:
      - valkey
    networks:
      - backend

volumes:
  core-data:
  valkey-data:

networks:
  # Firecrawl's docker-compose declares `networks.backend` without `name:`,
  # so Compose names it `firecrawl_backend` (project_name + network_name).
  # We join that same network so the Firecrawl api container can reach
  # SearXNG at http://searxng-core:8080 without exposing it on the host.
  backend:
    name: firecrawl_backend
    external: true
