# Inherit upstream defaults (limiter, image proxy, etc.) and override
# only what we care about: a curated set of engines plus the Wikimedia
# User-Agent suffix.
use_default_settings:
  outgoing:
    useragent_suffix: "(self-hosted; hermes-search; mailto:admin@localhost)"

server:
  # secret_key is overwritten by $SEARXNG_SECRET at container start.
  secret_key: "ultrasecretkey"
  image_proxy: true
  bind_address: "0.0.0.0"
  port: 8080

general:
  instance_name: "Hermes Search"

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "en"
  formats:
    - html
    - json

# Valkey for limiter/bot detection (set in env via SEARXNG_VALKEY_URL).
valkey:
  url: valkey://valkey:6379/0

# Curated engines. Mirrors Firecrawl .env SEARXNG_ENGINES.
engines:
  - name: google
    disabled: false
    shortcut: go
  - name: bing
    disabled: false
    shortcut: bi
  - name: duckduckgo
    disabled: false
    shortcut: ddg
  - name: brave
    disabled: false
    shortcut: br
  - name: startpage
    disabled: false
    shortcut: sp
  - name: wikidata
    disabled: false
    shortcut: wd
  - name: wikipedia
    disabled: false
    shortcut: wp
