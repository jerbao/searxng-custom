# Inherit upstream defaults (limiter, image proxy, etc.) and override
# only what we care about: a curated set of engines plus the Wikimedia
# User-Agent suffix.
use_default_settings:
  outgoing:
    useragent_suffix: "(self-hosted; hermes-search; mailto:admin@localhost)"

server:
  # Internal docker network only, consumed via JSON by Firecrawl: no
  # browser sessions and no image proxy, so nothing consumes the HMAC
  # derived from this key. It only has to differ from the upstream
  # "ultrasecretkey" default, which webapp.py rejects at startup.
  secret_key: ""
  image_proxy: false
  bind_address: "0.0.0.0"
  port: 8080

general:
  instance_name: "Hermes Search"

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "en"
  formats:
    - html
    - json

# Valkey for limiter/bot detection (set in env via SEARXNG_VALKEY_URL).
valkey:
  url: valkey://valkey:6379/0

# Curated engines. Original 7 (enabled by Firecrawl upstream setup) plus
# 23 engines empirically validated as functional in the 2026-08-26 audit
# (probe v1 results >= 20 OR parseable by parser-corrected v2). Names match
# the `name:` field in /config verbatim; no slug aliases invented.
engines:
  # ── Original 7 (unchanged) ────────────────────────────────────────
  - name: google
    disabled: false
    shortcut: go
  - name: bing
    disabled: false
    shortcut: bi
  - name: duckduckgo
    disabled: false
    shortcut: ddg
  - name: brave
    disabled: false
    shortcut: br
  - name: startpage
    disabled: false
    shortcut: sp
  - name: wikidata
    disabled: false
    shortcut: wd
  - name: wikipedia
    disabled: false
    shortcut: wp

  # ── HuggingFace trio (1000/788 results in probe v1) ───────────────
  - name: huggingface
    disabled: false
  - name: huggingface spaces
    disabled: false
  - name: huggingface datasets
